# Preserve a real client IP forwarded by the preview proxy; otherwise use the
# direct peer. Without this, the second nginx hop would replace X-Real-IP with
# the board's own address and MAC resolution would fail in the preview.
map $http_x_real_ip $piso_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;
    root /opt/pisowifi/frontend/dist;
    index index.html;

    location ^~ /api/internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $piso_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Same-origin proxy so the LAN admin browser can preview the guest portal
    # at 10.0.0.1 without a route to the customer VLAN. No frame-blocking headers.
    location /preview-portal/ {
        auth_basic "Piso WiFi preview";
        auth_basic_user_file /etc/pisowifi/htpasswd;
        proxy_pass http://10.0.0.1/;
        proxy_set_header Host 10.0.0.1;
        proxy_set_header X-Real-IP $piso_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 10.0.0.1:80;
    server_name 10.0.0.1 captive.apple.com;
    root /opt/pisowifi/frontend/dist;
    index index.html;

    # Internal API is loopback-only — guests must not reach it
    location ^~ /api/internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $piso_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/console {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 192.168.100.27:80;
    server_name 192.168.100.27;
    root /opt/pisowifi/frontend/dist;
    index index.html;

    location ^~ /api/internal/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $piso_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
